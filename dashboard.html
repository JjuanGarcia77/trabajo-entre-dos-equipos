<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatchFlow - Panel de Administración</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="./css/dashboard.css">
    <script src="./js/auth.js"></script>
</head>
<body>

    <div class="d-flex" id="wrapper">
        <div class="sidebar-wrapper border-end bg-dark text-white" id="sidebar-wrapper">
            <div class="sidebar-heading text-center py-4 fs-4 fw-bold border-bottom text-white">
                <i class="bi bi-shield-lock-fill me-2"></i>ADMIN FLOW
            </div>
            <div class="list-group list-group-flush my-3">
                <a href="#" onclick="showSection('users')" class="list-group-item list-group-item-action bg-transparent text-white active">
                    <i class="bi bi-people-fill me-2"></i>Todos los Usuarios
                </a>
                <a href="#" onclick="showSection('all-jobs')" class="list-group-item list-group-item-action bg-transparent text-white">
                    <i class="bi bi-briefcase-fill me-2"></i>Todas las Ofertas
                </a>
                <a href="#" onclick="showSection('all-matches')" class="list-group-item list-group-item-action bg-transparent text-white">
                    <i class="bi bi-diagram-3-fill me-2"></i>Monitoreo Matches
                </a>
                <a href="#" onclick="logout()" class="list-group-item list-group-item-action bg-transparent text-danger fw-bold mt-5">
                    <i class="bi bi-box-arrow-left me-2"></i>Cerrar Sesión
                </a>
            </div>
        </div>

        <div id="page-content-wrapper" class="w-100">
            <nav class="navbar navbar-expand-lg navbar-light bg-white py-3 px-4 shadow-sm">
                <h2 class="fs-4 m-0" id="pageTitle">Panel Administrativo</h2>
                <div class="ms-auto">
                    <span class="badge bg-danger">Modo Administrador</span>
                </div>
            </nav>

            <div class="container-fluid px-4 py-4">
                
                <section id="section-users" class="dashboard-section">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h5 class="card-title mb-4">Usuarios Registrados (Candidatos y Empresas)</h5>
                            <div class="table-responsive">
                                <table class="table table-hover align-middle">
                                    <thead class="table-light">
                                        <tr>
                                            <th>ID</th>
                                            <th>Nombre</th>
                                            <th>Email</th>
                                            <th>Rol</th>
                                            <th>Estado/Detalle</th>
                                        </tr>
                                    </thead>
                                    <tbody id="usersTableBody"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </section>

                <section id="section-all-jobs" class="dashboard-section d-none">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h5 class="card-title mb-4">Historial Global de Vacantes</h5>
                            <div class="table-responsive">
                                <table class="table table-hover">
                                    <thead class="table-light">
                                        <tr>
                                            <th>Empresa</th>
                                            <th>Título</th>
                                            <th>Skills</th>
                                            <th>Estado</th>
                                        </tr>
                                    </thead>
                                    <tbody id="allJobsTableBody"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </section>

                <section id="section-all-matches" class="dashboard-section d-none">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h5 class="card-title mb-4">Actividad de Matches en Tiempo Real</h5>
                            <div id="matchesMonitorGrid" class="row g-3"></div>
                        </div>
                    </div>
                </section>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/dasboard.js"></script>
</body>
</html>
