<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busca - Login & Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Poppins:wght@400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./css/login.css">

    <script src="./js/auth.js"></script>
    <script src="./js/login.js" defer></script>
</head>

<body class="d-flex align-items-center justify-content-center vh-100 overflow-hidden">

    <div class="video-container">
        <video autoplay muted loop playsinline id="bg-video">
            <source src="./img/vid/vid_logo.mp4" type="video/mp4">
        </video>
        <div class="overlay"></div>
    </div>

    <main class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
                <div class="login-card shadow-lg p-4 p-md-5">

                    <div class="position-fixed top-0 end-0 p-3" style="z-index: 1050;">
                        <a href="./index.html">
                            <button class="btn btn-logout shadow-sm">
                                <i class="bi bi-house-door me-2"></i>Inicio
                            </button>
                        </a>
                    </div>

                    <div class="text-center mb-4">
                        <h1 class="brand-name">BUSCA</h1>
                        <img src="./img/logo.png" alt="Logo" class="camel-img">
                    </div>

                    <div id="loginForm" class="form-section show">
                        <form id="formLogin">
                            <div class="mb-3">
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                    <input type="email" id="userLogin" class="form-control" placeholder="Email"
                                        required>
                                </div>
                            </div>
                            <div class="mb-4">
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                    <input type="password" id="passLogin" class="form-control" placeholder="Contraseña"
                                        required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-layers"></i></span>
                                    <select class="form-select" id="roleSelectLogin" required>
                                        <option value="" selected disabled>Tipo de perfil...</option>
                                        <option value="candidate">Candidato</option>
                                        <option value="company">Company</option>
                                    </select>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-login w-100 py-2 mb-3">INGRESAR</button>
                        </form>
                        <div class="text-center">
                            <p class="mb-0">¿No tienes cuenta? <a href="javascript:void(0)" onclick="showRegister()"
                                    class="register-link">Regístrate aquí</a></p>
                        </div>
                    </div>

                    <div id="registerForm" class="form-section d-none">
                        <form id="formRegister">
                            <div class="input-group mb-3">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" id="userReg" class="form-control" placeholder="Nombre completo"
                                    required>
                            </div>
                            <div class="input-group mb-3">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" id="emailReg" class="form-control" placeholder="Email" required>
                            </div>
                            <div class="input-group mb-3">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" id="passReg" class="form-control" placeholder="Contraseña"
                                    required>
                            </div>

                            <div class="mb-3">
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-layers"></i></span>
                                    <select class="form-select" id="roleSelectReg" required>
                                        <option value="" selected disabled>Tipo de perfil...</option>
                                        <option value="candidate">Candidato</option>
                                        <option value="company">Company</option>
                                    </select>
                                </div>
                            </div>

                            <div id="companyFields" class="extra-fields d-none">
                                <div class="input-group mb-3">
                                    <span class="input-group-text"><i class="bi bi-building"></i></span>
                                    <input type="text" id="companyName" class="form-control"
                                        placeholder="Nombre de la empresa">
                                </div>
                                <div class="mb-3">
                                    <textarea id="companyDesc" class="form-control" placeholder="Descripción breve"
                                        rows="2"></textarea>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-login w-100 py-2 mb-3">REGISTRARME</button>
                        </form>
                        <div class="text-center">
                            <p class="mb-0">¿Ya tienes cuenta? <a href="javascript:void(0)" onclick="showLogin()"
                                    class="register-link">Inicia sesión</a></p>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>

</html>
